name: PlateCraft BD Release CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring fixed debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for signingConfig debugConfig..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug & Test APKs
        run: ./gradlew assembleDebug

      - name: Prepare Release APK
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/app-debug.apk release_apks/PlateCraft-BD-v1.1.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlateCraft-BD-v1.1.3-APK
          path: release_apks/PlateCraft-BD-v1.1.3.apk

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.3
          name: PlateCraft BD v1.1.3 (Official Release)
          files: release_apks/PlateCraft-BD-v1.1.3.apk
          draft: false
          prerelease: false
          generate_release_notes: true
